name: build-and-release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayin surumu (v yazmadan, ornek: 0.25.0)'
        required: true
        default: '0.25.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release v0.25.0]')
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || (github.ref_type == 'branch' && 'v0.25.0' || github.ref_name) }}

    steps:
      - name: Push ile gelen v0.25.0 etiketini olustur
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v0.25.0';
            try {
              await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/tags/${tag}`, sha: context.sha });
            } catch (error) {
              if (error.status === 422) throw new Error(`${tag} etiketi zaten mevcut.`);
              throw error;
            }

      - name: Surum etiketini dogrula
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Surum X.Y.Z formatinda olmali. Girilen: $env:RELEASE_TAG"
          }

      - name: Surum etiketini main commitine olustur
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            } catch (error) {
              if (error.status === 422) {
                throw new Error(`${tag} etiketi zaten mevcut. Yeni bir sürüm numarası girin.`);
              }
              throw error;
            }

      - name: Etiketlenen kaynak kodu al
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Derle (csc / .NET Framework 4.8)
        shell: cmd
        run: build.bat

      - name: Kendi kendine test (MBAP + RTU cerceveleme, cozumleme, hata yollari)
        shell: cmd
        run: dist\SelfTest.exe

      - name: Release asset hazirla
        shell: pwsh
        run: |
          Copy-Item dist\ModbusScan.exe "ModbusScan-$env:RELEASE_TAG.exe"

      - name: Release yayinla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ModbusScan-${{ env.RELEASE_TAG }}.exe
          generate_release_notes: true
          body: |
            Modbus TCP + RS485 (RTU) okuma/yazma araci. Kurulum gerektirmez; Windows 10/11 uzerinde dogrudan calisir.

            **Indir:** `ModbusScan-${{ env.RELEASE_TAG }}.exe`

            Modbus TCP ve RS485/RTU baglantisi, FC01/02/03/04 okuma ve FC05/06/16 yazma desteklenir.
            Ayrintilar icin README.md.
