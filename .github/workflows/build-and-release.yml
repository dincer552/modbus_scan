name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Derle (csc / .NET Framework 4.8)
        shell: cmd
        run: build.bat

      - name: Kendi kendine test (MBAP cerceveleme + cozumleme + hata yollari)
        shell: cmd
        run: dist\SelfTest.exe

      - name: Release asset hazirla
        shell: pwsh
        run: |
          Copy-Item dist\ModbusScan.exe "ModbusScan-$env:GITHUB_REF_NAME.exe"

      - name: Release yayinla
        uses: softprops/action-gh-release@v2
        with:
          files: ModbusScan-${{ github.ref_name }}.exe
          generate_release_notes: true
          body: |
            Modbus TCP okuma araci (v0.1). Kurulum gerektirmez, Windows 10/11 uzerinde dogrudan calisir.

            **Indir:** `ModbusScan-${{ github.ref_name }}.exe`

            Not: Bu surum yalnızca okuma yapar (FC01/02/03/04). Yazma ve tarama sonraki surumlerde.
