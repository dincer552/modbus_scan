name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Derle (csc / .NET Framework 4.8)
        shell: cmd
        run: build.bat

      - name: Kendi kendine test (MBAP + RTU cerceveleme, cozumleme, hata yollari)
        shell: cmd
        run: dist\SelfTest.exe

      - name: Release asset hazirla
        shell: pwsh
        run: |
          Copy-Item dist\ModbusScan.exe "ModbusScan-$env:GITHUB_REF_NAME.exe"

      - name: Release yayinla
        uses: softprops/action-gh-release@v2
        with:
          files: ModbusScan-${{ github.ref_name }}.exe
          generate_release_notes: true
          body: |
            Modbus TCP + RS485 (RTU) okuma/yazma araci, varsayilan 500x600 px (boyutlandirilabilir). Kurulum gerektirmez, Windows 10/11 uzerinde dogrudan calisir.

            **Indir:** `ModbusScan-${{ github.ref_name }}.exe`

            Baglanti kutusunun basligindan TCP ya da RS485 sec: TCP'de IP/Port, RS485'te COM port, baud, parite, durdurma biti ve cihaz adresi sorulur.
            RS485'te COM listesini actiginda her portun yaninda Windows'taki adi yazar (orn. COM14 USB-SERIAL Ch A), boylece donusturucunu kolayca bulursun.
            Okuma: FC01/02/03/04. Yazma: FC05/FC06/FC16 - tabloda bir hucreye cift tiklayarak.
            Adet siniri yok: 125 kayittan buyuk araliklar otomatik olarak parcalara bolunup ardisik isteklerle okunur (durum satirinda "3 istek" gibi gorunur).
            Pencereyi kenarindan buyutebilir/kucultebilir, sutun genisliklerini basliklardan surukleyerek ayarlayabilirsin.
            Kayitlara isim verebilirsin: Tanim sutununa yaz veya Excel'de kopyaladigin sutunu Ctrl+V ile yapistir.
            Ayrinti icin README.md.
